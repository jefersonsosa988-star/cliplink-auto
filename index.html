<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipLink Automático</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; background: #090b10; color: #f1f5f9; }</style>
</head>
<body class="min-h-screen flex flex-col items-center px-4 py-10">
  <div class="w-full max-w-3xl flex flex-col gap-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-white">ClipLink Automático</h1>
      <p class="text-sm text-slate-400 mt-1">Sube un video desde tu celular o pega un enlace para generar clips 9:16 listos para descargar.</p>
      <span id="conn-badge" class="inline-block mt-2 text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-300">Verificando conexión...</span>
    </div>

    <form id="auto-form" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col gap-4">
      <div>
        <label class="block text-xs font-semibold text-violet-300 mb-1.5">Opción 1 (Recomendada en Render): Sube un video de tu celular</label>
        <input id="file-input" type="file" accept="video/*" class="w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-violet-600 file:text-white hover:file:bg-violet-500 cursor-pointer bg-slate-950 border border-slate-700 rounded-xl p-2" />
      </div>

      <div class="flex items-center gap-3 text-xs text-slate-500">
        <span class="flex-1 h-px bg-slate-800"></span>
        <span>o pega un enlace</span>
        <span class="flex-1 h-px bg-slate-800"></span>
      </div>

      <input id="url-input" type="url" placeholder="https://youtu.be/... (puede fallar en la nube si la plataforma bloquea)" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-violet-500" />

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Cantidad de clips</label>
          <select id="count-select" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white">
            <option value="3" selected>3 clips</option>
            <option value="5">5 clips</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Duración por clip</label>
          <select id="len-select" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white">
            <option value="15">15 segundos</option>
            <option value="25" selected>25 segundos</option>
            <option value="45">45 segundos</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Formato</label>
          <select id="ratio-select" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white">
            <option value="9:16" selected>9:16 Vertical</option>
            <option value="16:9">16:9 Horizontal</option>
          </select>
        </div>
      </div>

      <button id="btn-submit" type="submit" class="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 font-semibold text-sm text-white cursor-pointer disabled:opacity-50">
        Generar clips automáticamente
      </button>
      <p id="status-msg" class="text-xs text-slate-400 text-center min-h-[1rem]"></p>
    </form>

    <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:5000' : '';
    const form = document.getElementById('auto-form');
    const fileInput = document.getElementById('file-input');
    const urlInput = document.getElementById('url-input');
    const countSelect = document.getElementById('count-select');
    const lenSelect = document.getElementById('len-select');
    const ratioSelect = document.getElementById('ratio-select');
    const btnSubmit = document.getElementById('btn-submit');
    const statusMsg = document.getElementById('status-msg');
    const connBadge = document.getElementById('conn-badge');
    const grid = document.getElementById('results-grid');

    async function checkServer() {
      try {
        const res = await fetch(`${API_BASE}/api/health`);
        const data = await res.json();
        if (data.ok && data.ffmpeg) {
          connBadge.textContent = 'Servidor conectado y listo';
          connBadge.className = 'inline-block mt-2 text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300';
        } else {
          connBadge.textContent = 'Falta instalar FFmpeg en el servidor';
          connBadge.className = 'inline-block mt-2 text-xs px-3 py-1 rounded-full bg-amber-500/20 text-amber-300';
        }
      } catch {
        connBadge.textContent = 'Servidor apagado — ejecuta iniciar.bat o python server.py';
        connBadge.className = 'inline-block mt-2 text-xs px-3 py-1 rounded-full bg-rose-500/20 text-rose-300';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files && fileInput.files[0];
      const url = urlInput.value.trim();
      if (!file && !url) {
        statusMsg.textContent = 'Selecciona un video de tu celular o pega un enlace.';
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = file ? 'Subiendo y recortando clips...' : 'Descargando y generando clips...';
      statusMsg.textContent = 'Procesando en el servidor, espera un momento...';
      grid.innerHTML = '';

      try {
        let res;
        if (file) {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('count', countSelect.value);
          fd.append('clipLen', lenSelect.value);
          fd.append('ratio', ratioSelect.value);
          res = await fetch(`${API_BASE}/api/auto-clips`, { method: 'POST', body: fd });
        } else {
          res = await fetch(`${API_BASE}/api/auto-clips`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url,
              count: Number(countSelect.value),
              clipLen: Number(lenSelect.value),
              ratio: ratioSelect.value
            })
          });
        }

        const rawText = await res.text();
        let data = {};
        try { data = rawText ? JSON.parse(rawText) : {}; } catch {}
        if (!res.ok) {
          throw new Error(data.error || `El servidor tardó demasiado o se quedó sin memoria (HTTP ${res.status}). Prueba con un video más corto o elige 15s.`);
        }

        statusMsg.textContent = `¡Listo! Se generaron ${data.clips.length} clips de "${data.videoTitle}"`;
        data.clips.forEach((clip) => {
          const fullUrl = `${API_BASE}${clip.url}`;
          const card = document.createElement('div');
          card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col gap-2.5';
          card.innerHTML = `
            <video src="${fullUrl}" controls class="w-full rounded-xl bg-black aspect-[9/16] object-cover"></video>
            <div class="flex items-center justify-between text-xs">
              <span class="font-semibold text-white">${clip.title}</span>
              <span class="font-mono text-slate-400">${clip.start}s–${clip.end}s</span>
            </div>
            <a href="${fullUrl}" download="${clip.filename}" class="w-full py-2 text-center rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white">
              Descargar MP4
            </a>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        statusMsg.textContent = err.message === 'Failed to fetch'
          ? 'No se pudo conectar con el servidor.'
          : err.message;
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Generar clips automáticamente';
      }
    });

    checkServer();
  </script>
</body>
</html>
